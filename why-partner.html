 in Indonesia`,description:`From 2017, support for local organisations adopting temporary closures became the entry point to broader community-based management.`,imageLabel:`Community meeting, Indonesian coastal village`,linkText:`Read this story`},{id:`card-case-west-africa`,href:`case-west-africa.html`,category:`west-africa`,heading:`Funding that community organisations control`,description:`The Frontline Community Fund provides direct, flexible, multi-year funding so organisations can set their own priorities and scale what works.`,imageLabel:`Community organisation planning session, West Africa`,linkText:`Read this story`}],Ke={homepage:{hero:{component:`wf-homepage-hero`,props:{heading:`Community-powered change`,body:`Coastal communities are restoring the ocean. We remove the barriers standing in their way: funding, data, training and advocacy.`,ctaLabel:`See where communities are leading`,ctaHref:`#regions`,ctaId:`cta-hero-regions`}},blocks:[{component:`wf-statistics`,props:{heading:`The scale of the network`,items:[{value:`12`,label:`Countries where community-led fisheries reform is underway`},{value:`200+`,label:`Locally managed marine areas across Madagascar`},{value:`2004`,label:`The year Andavadoaka trialled the first temporary octopus closure`},{value:`To confirm`,label:`Community organisations supported through the Frontline Community Fund`}]}},{component:`wf-text-media`,props:{heading:`We are a platform, not a project implementer`,body:[`Communities establish the marine areas. Communities set the rules, monitor the results and adapt them over time. Our job is to remove what stands in the way.`,`A locally managed marine area is a part of the ocean where local people hold the rights to manage their marine resources, supported by their government. A community-led management group decides what is fished, when, and where, and protects the coral reef and mangrove habitats the fishery depends on.`,`That distinction matters. We do not prioritise on behalf of communities, and we are not the owner of the work they do.`],side:`left`,mediaLabel:`Community management group meeting on the shore`,ctaLabel:`How partnership works`,ctaHref:`why-partner.html`}},{component:`wf-region-map`,anchorId:`regions`,props:{heading:`Where communities are leading`,intro:`Select a region to see the work happening there. Every story below is led by the community or partner organisation named in it.`,regions:Ge,items:N,cols:3}},{component:`wf-quote`,props:{items:[{quote:`The change we want to achieve we cannot do alone. It requires a whole network of people. We want to become that enabler for people to work together.`,attribution:`Ebrima Saidy`,role:`Chief Executive, Blue Ventures`},{quote:`We do not need to shout about what we have done, but rather what the fishers and coastal communities have done.`,attribution:`Blue Ventures stakeholder interview, August 2026`}]}},{component:`wf-text-media`,props:{heading:`Data collected by communities, owned by communities`,body:[`Fishers and local partners collect, understand and use their own data to strengthen governance, improve fisheries management and defend their rights.`,`We provide simple, adaptable digital tools for tracking catches and monitoring habitats, and we bring in data from other tools too, so partners are never forced to learn a new system. Many already have their own.`,`In some places, data collectors now share their findings with the president, and government asks them to keep collecting. It is entirely human led.`],side:`right`,mediaLabel:`Fisher recording catch data on a mobile device`}},{component:`wf-links`,anchorId:`due-diligence`,props:{heading:`For funders: the evidence you need, up front`,cols:4,items:[{href:`why-fund.html#due-diligence`,label:`Financial statements and accounts`,description:`Audited accounts for the last five years.`},{href:`why-fund.html#due-diligence`,label:`Annual report and evaluations`,description:`Programme evaluations and independent reviews.`},{href:`why-fund.html#due-diligence`,label:`Board and senior leadership`,description:`Who governs Blue Ventures, and their backgrounds.`},{href:`why-fund.html#due-diligence`,label:`Published research and toolkits`,description:`Peer-reviewed research and practitioner resources.`}]}},{component:`wf-signup-form`,props:{heading:`Monthly stories from the network`,body:`A retrospective of what coastal communities across the network have done that month, in stories, data and video.`,submitLabel:`Subscribe`}},{component:`wf-promo`,props:{heading:`Why fund Blue Ventures?`,body:`Rather than funding a handful of large projects, we move funding to many small ones, run and devised by the communities themselves. Here is the case, the evidence behind it, and everything your due diligence process needs.`,side:`left`,ctaLabel:`See the case for funding`,ctaHref:`why-fund.html`,ctaId:`cta-home-fund`,mediaLabel:`Community organisation receiving a grant`}},{component:`wf-promo`,props:{heading:`Why partner with Blue Ventures`,body:`We support partners with funding, data tools, training and advocacy, without asking them to change how they already work. Here is what a partnership involves and how to start one.`,side:`right`,ctaLabel:`Explore partnership`,ctaHref:`why-partner.html`,ctaId:`cta-home-partner`,mediaLabel:`Partner organisations at a peer exchange`}}]},"why-fund":{hero:{component:`wf-standard-hero`,props:{eyebrow:`For funders and institutional donors`,heading:`Why fund Blue Ventures?`,body:`Your funding reaches the coastal communities doing the work, with the evidence to show what it changes. Everything a due diligence process needs is on this page.`,ctaLabel:`Start a conversation`,ctaHref:`#talk`,ctaId:`cta-fund-talk`,secondaryLabel:`Go to due diligence`,secondaryHref:`#due-diligence`,mediaLabel:`Community-led fishery monitoring in progress`,breadcrumb:M({label:`Why fund Blue Ventures?`,href:`why-fund.html`})}},blocks:[{component:`wf-text`,props:{heading:`The case for funding community-led fisheries reform`,body:[`All life depends on flourishing seas. They are emptying, and the pockets and bellies of those who depend most on them are emptying too.`,`Communities are best placed to restore those seas. What stops them is not will or knowledge, it is access: to legal rights, to training, to funding, and to the data that makes their case. Removing those barriers is cheaper, faster and more durable than delivering conservation on their behalf.`,`Rather than funding a few large-scale projects, we fund many smaller ones across fishing communities and community interest groups. It is more time and effort intensive. It is also what makes the change stick, because the priorities were never ours to set.`]}},{component:`wf-statistics`,props:{heading:`What your funding is joining`,items:[{value:`12`,label:`Countries with community-led fisheries reform underway`},{value:`2003`,label:`Founded in Madagascar, fully localised leadership since 2023`},{value:`Multi-year`,label:`Frontline Community Fund grant duration, set by the recipient`},{value:`To confirm`,label:`Average grant size, pending sign-off from the grants team`}]}},{component:`wf-text-media`,props:{heading:`Your funding reaches community organisations directly`,body:[`We support community-based organisations with direct, flexible, multi-year funding, designed so communities set their own priorities and scale what works.`,`Flexibility and duration are the point. Short, restricted grants force organisations into short-term projects. Longer, unrestricted ones let them plan, hire, and move from projects to lasting stewardship.`,`We also fund the things that make funding usable: training, peer exchange, and the data systems communities need to show a government or a donor what changed.`],side:`left`,mediaLabel:`Grant planning session with a community organisation`}},{component:`wf-links`,anchorId:`due-diligence`,props:{heading:`Due diligence pack`,cols:3,items:[{href:`#due-diligence-detail`,label:`Financial statements and accounts`,description:`Audited accounts, five year history.`},{href:`#due-diligence-detail`,label:`Annual report`,description:`Activities, spend and outcomes by year.`},{href:`#due-diligence-detail`,label:`Board and senior leadership`,description:`Names, roles, backgrounds and declarations.`},{href:`#due-diligence-detail`,label:`Programme evaluations`,description:`Independent evaluations of our programmes.`},{href:`#due-diligence-detail`,label:`American Friends of Blue Ventures`,description:`501(c)(3) details for donors giving from the US.`},{href:`#due-diligence-detail`,label:`Verification and contact`,description:`Publicly listed phone number and postal address.`}]}},{component:`wf-accordion`,anchorId:`due-diligence-detail`,props:{heading:`Questions funders ask us`,multiOpen:!0,items:[{heading:`What is in each document, and how current is it?`,body:`Each item in the pack above carries its publication date and the period it covers. Financial statements are audited and published annually. Programme evaluations are published as they are completed, including the ones whose findings were uncomfortable.`},{heading:`Are you an impact investment firm?`,body:`No. The word "venture" in our name predates the sector it now sounds like. Blue Ventures is a marine conservation NGO. We do not take equity, we do not seek a financial return, and every pound of funding we receive moves toward coastal communities and the systems that support them.`},{heading:`Do you still deliver projects directly?`,body:`Not since 2020. We pivoted away from running our own expedition and delivery programmes to become an enabling platform: funding, data, training and advocacy for local organisations. This shift has not fully landed with external audiences, particularly in Belize and Madagascar where we historically had a hands-on presence, so it is worth stating plainly.`},{heading:`You received a very large grant. Do you still need funding?`,body:`Yes. A single transformational grant does not fund a network across 12 countries, and it does not replace the multi-year, flexible funding that community organisations need. Grants in the hundred thousand range are not marginal to us, they are what keeps the Frontline Community Fund moving.`},{heading:`How can we verify we are talking to Blue Ventures?`,body:`Some institutional donors have policies preventing them from calling a mobile number directly. Our publicly listed office number is answered by a named member of staff who will confirm the identity of anyone you have been speaking to and route you onward, including to the Chief Executive.`},{heading:`What is your relationship to the Transform Bottom Trawling Coalition?`,body:`We host the coalition. We are not the owner of its work. It is a global movement uniting fishing communities against the most destructive form of industrial fishing, and its members drive it.`}]}},{component:`wf-form`,anchorId:`talk`,props:{heading:`Start a conversation with our development team`,intro:`Tell us roughly what you are considering and someone from the development team will come back to you within five working days. We would rather have a conversation than receive an application.`,submitLabel:`Send enquiry`,submitId:`form-fund-submit`,successHeading:`Thank you, we have your enquiry.`,successBody:`Someone from the development team will be in touch within five working days.`,fields:[{name:`name`,label:`Your name`,type:`text`,required:!0},{name:`organisation`,label:`Organisation`,type:`text`,required:!0},{name:`email`,label:`Email address`,type:`email`,required:!0},{name:`funderType`,label:`Which best describes you?`,type:`select`,required:!0,options:[`Institutional donor or foundation`,`Individual philanthropist`,`Corporate or employee giving`,`Advisor acting for a donor`,`Something else`]},{name:`region`,label:`Where are you based?`,type:`select`,options:[`United Kingdom`,`United States`,`Western Europe`,`Gulf and Middle East`,`Asia Pacific`,`Elsewhere`]},{name:`message`,label:`What would you like to discuss?`,type:`textarea`,placeholder:`Areas of interest, timelines, anything your process needs from us.`}]}}]},"why-partner":{hero:{component:`wf-standard-hero`,props:{eyebrow:`For community partners and peer organisations`,heading:`Why partner with Blue Ventures`,body:`You set the priorities. We remove the barriers to funding, data, training and advocacy, and we work with the systems you already use.`,ctaLabel:`Talk to our partnerships team`,ctaHref:`#talk`,ctaId:`cta-partner-talk`,mediaLabel:`Partner organisations at a regional peer exchange`,breadcrumb:M({label:`Why partner with Blue Ventures`,href:`why-partner.html`})}},blocks:[{component:`wf-text`,props:{heading:`What partnership actually means here`,body:[`Blue Ventures works as a platform to back community action. We are not looking for organisations to deliver our programme, and we are not looking to embed ourselves in your work.`,`Partnership means you keep the mandate. Your community management group sets the rules for your waters. Your organisation decides what the funding is for. We are accountable to making those things possible, and to being honest about where our contribution ends and yours begins.`]}},{component:`wf-cards`,anchorId:`partner-benefits`,props:{heading:`What partners get`,cols:4,items:[{heading:`Flexible, multi-year funding`,description:`Direct funding you set the priorities for, over a duration long enough to plan around rather than react to.`,imageLabel:`Grant agreement signing`},{heading:`Data tools you own`,description:`Simple tools for tracking catches and monitoring habitats. If you already have a data system, we bring your data in rather than asking you to switch.`,imageLabel:`Catch monitoring dashboard`},{heading:`Training and peer exchange`,description:`Tailored training based on what you tell us you need, and a community of practice with partners facing the same questions.`,imageLabel:`Peer exchange workshop`},{heading:`Advocacy and policy support`,description:`Support to take your evidence to government, and a global movement that amplifies the collective voice of small-scale fishers.`,imageLabel:`Fishers speaking at a policy forum`}]}},{component:`wf-quote`,props:{items:[{quote:`We also bring in data from other tools so we are never forcing partners to learn to use new tools. They can use whatever they want to. Many partners already have their own data systems.`,attribution:`Blue Ventures stakeholder interview, August 2026`}]}},{component:`wf-text-media`,props:{heading:`Communities established the marine reserves. Not us.`,body:[`Every conversation we had internally while planning this website came back to the same point: be careful about credit.`,`Blue Ventures enables outcomes rather than delivering them. Where a locally managed marine area exists, a community established it. Where a fishery has recovered, fishers did that. Where a government now asks a village to keep collecting data, that trust was earned locally.`,`This is not modesty for its own sake. Getting attribution right is what keeps the model working, and getting it wrong is how an enabling organisation quietly turns into a prescribing one.`],side:`right`,mediaLabel:`Community management group marking out LMMA boundaries`}},{component:`wf-accordion`,props:{heading:`Questions prospective partners ask`,items:[{heading:`Do we have to use your tools and systems?`,body:`No. We bring in data from other tools so partners are never forced to learn a new system. Many partners arrive with their own, and that is fine.`},{heading:`Who owns the data our community collects?`,body:`You do. Community-owned data is the point of the model. It informs your management decisions, supports your advocacy, and builds your organisation's financial identity. We only ever share aggregated or anonymised data publicly, and never anything tied to an individual community's tax position or safety.`},{heading:`What does Blue Ventures expect from us in return?`,body:`Honest reporting on what the funding did, including when it did not work. We are not looking for success stories on demand.`},{heading:`We are a peer organisation, not a community partner. Is this still for us?`,body:`Yes. Practitioners and peer organisations mostly come to us for resource access: tools, research and shared knowledge. That route is open regardless of whether we fund you.`}]}},{component:`wf-form`,anchorId:`talk`,props:{heading:`Talk to our partnerships team`,intro:`Tell us about your organisation and the coastline you work on. A member of the partnerships team will respond within ten working days, and can arrange a conversation in English, French, Malagasy or Bahasa Indonesia.`,submitLabel:`Send enquiry`,submitId:`form-partner-submit`,successHeading:`Thank you, we have your enquiry.`,successBody:`A member of the partnerships team will respond within ten working days.`,fields:[{name:`name`,label:`Your name`,type:`text`,required:!0},{name:`organisation`,label:`Organisation`,type:`text`,required:!0},{name:`email`,label:`Email address`,type:`email`,required:!0},{name:`partnerType`,label:`Which best describes your organisation?`,type:`select`,required:!0,options:[`Community-based organisation`,`National or local NGO`,`Fisher association or cooperative`,`Peer conservation organisation`,`Government or agency`,`Something else`]},{name:`language`,label:`Preferred language`,type:`select`,options:[`English`,`French`,`Malagasy`,`Bahasa Indonesia`]},{name:`message`,label:`Tell us about your work`,type:`textarea`,placeholder:`Where you work, who you work with, and what you are trying to do next.`}]}}]},"region-madagascar":{hero:{component:`wf-standard-hero`,props:{eyebrow:`Where we work`,heading:`Madagascar`,body:`Blue Ventures was founded in Madagascar in 2003. Two decades on, over 200 locally managed marine areas sit along this coastline, and the model that produced them has travelled well beyond it.`,ctaLabel:`Read the Andavadoaka story`,ctaHref:`case-madagascar.html`,ctaId:`cta-madagascar-story`,mediaLabel:`Pirogues on the shore at Andavadoaka`,breadcrumb:M({label:`Our work`,href:`madagascar.html`},{label:`Madagascar`,href:`madagascar.html`})}},blocks:[{component:`wf-text`,props:{heading:`A coastline that changed how ocean conservation is done`,body:[`Our operations began in Andavadoaka, home of the first Blue Ventures office, working alongside coastal communities, researchers and scientists on fisheries management, habitat restoration and livelihoods.`,`In 2007 community health, education and waste management were folded into the model, which at the time was an unusual thing for a marine conservation organisation to do. It reflected something the communities had been saying: a fishery is not separable from the household that depends on it.`,`Leadership here is now local, as it is across every country we work in. National teams are recruited from within the region, and Blue Ventures is legally established in each country of operation.`]}},{component:`wf-statistics`,props:{heading:`Madagascar in numbers`,items:[{value:`2003`,label:`Blue Ventures founded in Madagascar`},{value:`2004`,label:`First temporary octopus closure trialled in Andavadoaka`},{value:`200+`,label:`Locally managed marine areas nationwide`},{value:`To confirm`,label:`Partner organisations currently supported in country`}]}},{component:`wf-text-media`,props:{heading:`Stories from here are not in short supply`,body:[`There is a comms team in Madagascar producing a great deal of video, much of it made for training and much of it sitting on YouTube where the people who would benefit from it are unlikely to find it.`,`Getting this material into the right format, in the right place, in the right language, is one of the things this website needs to fix. This region page is where that content should live.`],side:`left`,mediaLabel:`Video still from a community training session`}},{component:`wf-media`,props:{type:`video`,label:`Community management group in Andavadoaka, filmed by the Madagascar comms team`,caption:`Placeholder for existing footage. The playback found a considerable library of video already exists, largely unused outside internal training.`}},{component:`wf-cards`,props:{heading:`From across the network`,cols:2,items:[N[1],N[2]]}},{component:`wf-promo`,props:{heading:`Fund the next stretch of coastline`,body:`Madagascar has over 200 locally managed marine areas because communities kept going after the first one worked. Funding is what determines how far along the coast that can continue.`,side:`left`,ctaLabel:`See the case for funding`,ctaHref:`why-fund.html`,ctaId:`cta-madagascar-promo`,mediaLabel:`Coastline at dawn`}}]},"case-madagascar":{hero:{component:`wf-standard-hero`,props:{eyebrow:`Madagascar`,heading:`The closure that doubled catches in Andavadoaka`,body:`In 2004 the Andavadoaka community closed part of its octopus fishery for a few months. What happened when it reopened changed the approach of an entire sector.`,mediaLabel:`Fishers landing octopus catch at Andavadoaka`,breadcrumb:M({label:`Our work`,href:`madagascar.html`},{label:`Madagascar`,href:`madagascar.html`},{label:`Andavadoaka octopus closures`,href:`case-madagascar.html`})}},blocks:[{component:`wf-text`,props:{centered:!0,body:[`The idea was not imported. Octopus grow fast, and fishers in Andavadoaka already knew that leaving an area alone for a season would let the animals in it get considerably bigger. What was missing was not the insight, it was a way to hold the agreement.`,`In 2004 the community agreed to close part of its octopus fishery temporarily. Everyone gave up catch in the short term on the understanding that everyone would benefit when it reopened. That agreement was the hard part, and it was theirs.`]}},{component:`wf-text`,props:{heading:`What happened when it reopened`,centered:!0,body:[`Catches doubled. So did fisher income. The result was immediate enough, and visible enough, that neighbouring villages did not need persuading.`,`Temporary closures spread along the coast, and then inland through the networks that connect fishing communities to each other. Over time they became the entry point to something larger: not just a closed area for a season, but a locally managed marine area with rules, boundaries and a management group with the standing to enforce them. Over 200 now exist nationwide.`]}},{component:`wf-media`,props:{type:`image`,centered:!0,label:`Octopus catch being weighed and recorded at the landing site`,caption:`Catch data recorded by community data collectors is what turned one village's result into an argument other communities could act on.`}},{component:`wf-text`,props:{heading:`Why this is not a Blue Ventures success story`,centered:!0,body:[`It is tempting to tell this as an organisational achievement. It is not one. The Andavadoaka community established the closure, held the agreement through the months when nobody was fishing that patch, and decided to do it again.`,`What Blue Ventures contributed was narrower and worth being precise about: support to monitor the outcome, and the means to record what happened in a form that other communities and, later, government could act on. The evidence mattered. It was not the same thing as the decision.`,`That distinction runs through everything that followed. The model spread because it worked for the people using it, not because it was promoted.`]}},{component:`wf-share`,props:{centered:!0}},{component:`wf-cards`,props:{heading:`Related stories`,cols:2,items:[N[1],N[2]]}},{component:`wf-promo`,props:{heading:`Fund what communities decide to do next`,body:`Andavadoaka worked because the community could act on what it already knew. Funding removes the barriers that stop that happening elsewhere.`,side:`left`,ctaLabel:`See the case for funding`,ctaHref:`why-fund.html`,ctaId:`cta-case-madagascar-promo`,mediaLabel:`Fishers preparing to launch at dawn`}}]},"case-indonesia":{hero:{component:`wf-standard-hero`,props:{eyebrow:`Indonesia`,heading:`Scaling through local organisations, not through offices`,body:`In 2017 Blue Ventures expanded to Indonesia with a deliberate constraint: support organisations that were already there rather than build a presence of our own.`,mediaLabel:`Community meeting in an Indonesian coastal village`,breadcrumb:M({label:`Our work`,href:`madagascar.html`},{label:`Scaling through partners in Indonesia`,href:`case-indonesia.html`})}},blocks:[{component:`wf-text`,props:{centered:!0,body:[`By 2017 the temporary closure model had a track record. The open question was how it should travel.`,`The answer, in Indonesia and Tanzania that same year, was to support local organisations to adopt temporary octopus closures themselves, and to treat that as an entry point rather than an end point. A closure is a manageable first step. Broader community-based management follows once a community has seen its own rules produce a result.`]}},{component:`wf-text`,props:{heading:`Why the constraint mattered`,centered:!0,body:[`Opening our own offices would have been faster in the short term and worse in every term after that. It would have made communities dependent on an organisation headquartered somewhere else, and it would have put Blue Ventures in the position of setting priorities for coastlines we do not live on.`,`This shift marked the start of a partnership-based model for scaling community-led conservation globally, and by 2020 it had become the whole strategy. We pivoted away from expedition programmes entirely and put everything into supporting long-term, community-led marine conservation and grassroots fishery management.`]}},{component:`wf-media`,props:{type:`image`,centered:!0,label:`Local partner organisation staff running a community mapping session`,caption:`Partner-led delivery means the people running the session live on the coastline it concerns.`}},{component:`wf-text`,props:{heading:`What this asks of us`,centered:!0,body:[`An enabling model is harder to describe than a delivery model, and harder to take credit for. It also means accepting that partners will do things differently from how we would have done them, which is the point rather than a tolerated side effect.`,`It shapes practical decisions too. We bring in data from whatever tools a partner already uses rather than asking them to adopt ours. Funding is flexible and multi-year so partners can plan. Training is built from what partners say they need.`]}},{component:`wf-share`,props:{centered:!0}},{component:`wf-cards`,props:{heading:`Related stories`,cols:2,items:[N[0],N[2]]}},{component:`wf-promo`,props:{heading:`Partner with Blue Ventures`,body:`If your organisation works with coastal communities on fisheries management, the partnership route is open whether or not we fund you.`,side:`left`,ctaLabel:`Explore partnership`,ctaHref:`why-partner.html`,ctaId:`cta-case-indonesia-promo`,mediaLabel:`Partner organisations at a peer exchange`}}]},"case-west-africa":{hero:{component:`wf-standard-hero`,props:{eyebrow:`West Africa`,heading:`Funding that community organisations actually control`,body:`The Frontline Community Fund provides direct, flexible, multi-year funding to community-based organisations, so the people closest to the coastline set the priorities for it.`,mediaLabel:`Community organisation planning session, West Africa`,breadcrumb:M({label:`Our work`,href:`madagascar.html`},{label:`Frontline Community Fund, West Africa`,href:`case-west-africa.html`})}},blocks:[{component:`wf-text`,props:{centered:!0,body:[`Most conservation funding arrives restricted, short, and shaped by someone who has never fished the water in question. Organisations spend the grant proving they spent it correctly, and then spend the following year looking for the next one.`,`The Frontline Community Fund is built the other way round. Funding is direct, flexible and multi-year. The recipient organisation sets its own priorities and scales what works, which is only possible when the money is not pre-allocated to somebody else's plan.`]}},{component:`wf-text`,props:{heading:`Small grants, long durations, deliberately`,centered:!0,body:[`Funding many small projects across fishing communities and community interest groups is more time and effort intensive than funding a handful of large ones. It requires more relationships, more listening and more administrative work per pound moved.`,`It is also what differentiates this fund. Grant size and duration are both unusual for the sector, and both are chosen rather than incidental. A small, long, unrestricted grant is a different instrument from a large, short, restricted one, and it produces different organisations.`]}},{component:`wf-media`,props:{type:`image`,centered:!0,label:`Fishers and community organisation staff reviewing catch records together`,caption:`Aggregate fund data, including organisations supported, locations, grant size and duration, is one of the clearest ways to show how this model differs.`}},{component:`wf-text`,props:{heading:`What the data can and cannot show`,centered:!0,body:[`Aggregated and anonymised figures can be shared globally and publicly: how many organisations are supported, where, at what volume, at what average grant size, over what duration.`,`What cannot be shared is anything that ties back to an individual community's tax position or safety. That constraint is not a limitation on transparency, it is part of what makes communities willing to share data at all, and it will shape how impact data appears on this website.`]}},{component:`wf-share`,props:{centered:!0}},{component:`wf-cards`,props:{heading:`Related stories`,cols:2,items:[N[0],N[1]]}},{component:`wf-promo`,props:{heading:`Fund the Frontline Community Fund`,body:`Grants in the hundred thousand range are not marginal here. They are what keeps direct, flexible funding moving to community organisations.`,side:`left`,ctaLabel:`See the case for funding`,ctaHref:`why-fund.html`,ctaId:`cta-case-west-africa-promo`,mediaLabel:`Coastal community organisation meeting`}}]},donate:{hero:{component:`wf-standard-hero`,props:{eyebrow:`Support the network`,heading:`Donate`,body:`Every donation moves toward coastal communities managing their own waters. Regular giving is what lets community organisations plan beyond the current year.`,mediaLabel:`Community members returning from a fishing trip`,breadcrumb:M({label:`Donate`,href:`donate.html`})}},blocks:[{component:`wf-text`,props:{body:[`Donations here go to the general fund, which supports the Frontline Community Fund, the data tools communities use, and the training and peer exchange that connect them. If you are considering a larger gift or giving through a foundation, the development team would rather have a conversation first.`]}},{component:`wf-form`,anchorId:`donate-form`,props:{submitId:`form-donate-submit`,variants:[{key:`monthly`,tabLabel:`Give monthly`,heading:`Give monthly`,intro:`Regular giving is the most useful kind. It is what makes multi-year funding to community organisations possible.`,submitLabel:`Set up monthly gift`,submitId:`form-donate-submit`,successHeading:`Thank you. Your monthly gift is set up.`,successBody:`You will receive a confirmation by email, along with the monthly retrospective from across the network.`,fields:[{name:`amount`,label:`Monthly amount`,type:`select`,required:!0,options:[`£10`,`£25`,`£50`,`£100`,`Another amount`]},{name:`name`,label:`Your name`,type:`text`,required:!0},{name:`email`,label:`Email address`,type:`email`,required:!0},{name:`giftAid`,label:`Are you a UK taxpayer?`,type:`radio`,options:[`Yes, add Gift Aid`,`No`]}]},{key:`once`,tabLabel:`Give once`,heading:`Make a one-off donation`,intro:`A single gift, whenever suits you.`,submitLabel:`Donate`,submitId:`form-donate-once-submit`,successHeading:`Thank you for your donation.`,successBody:`A receipt is on its way to your inbox.`,fields:[{name:`amount`,label:`Amount`,type:`select`,required:!0,options:[`£25`,`£50`,`£100`,`£250`,`Another
